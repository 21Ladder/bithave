name: bithave-full

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bithave_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bithave_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bithave_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - bithave_network

  # Spring Boot Backend
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: bithave_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      BTCPAY_URL: ${BTCPAY_URL}
      BTCPAY_STORE_ID: ${BTCPAY_STORE_ID}
      BTCPAY_API_TOKEN: ${BTCPAY_API_TOKEN}
      BTCPAY_WEBHOOK_SECRET: ${BTCPAY_WEBHOOK_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - bithave_network

  # Angular Frontend (served via nginx)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: bithave_frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bithave_network

networks:
  bithave_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
