spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:bithave_db}  # Host = Service-Name
    username: ${POSTGRES_USER:bithave_user}
    password: ${POSTGRES_PASSWORD:bithave_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  session:
    store-type: redis
    timeout: 7d

  data:
    redis:
      host: redis
      port: 6379

coingecko:
  apiKey: ${COINGECKO_API_KEY}

btcpay:
  url: ${BTCPAY_URL}
  store-id: ${BTCPAY_STORE_ID}
  api-token: ${BTCPAY_API_TOKEN}

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
