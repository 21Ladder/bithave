<div class="toolbar box">
  <form class="filter" (ngSubmit)="searchOrSort()">
    <input type="search" name="q" [(ngModel)]="q" placeholder="Search..." />

    <div class="controls">
      <select name="sort" [(ngModel)]="sort">
        <option value="createdAt">Latest</option>
        <option value="priceUsd">Price (USD)</option>
      </select>

      <button type="button" (click)="toggleOrder()">
        {{ order === 'DESC' ? 'Descending' : 'Ascending' }}
      </button>

      <button type="submit">Apply</button>
    </div>
  </form>
</div>

<!-- Breadcrumbs -->
<nav class="breadcrumbs">
  <button type="button" (click)="goToLevel(-1)">All</button>

  @for (seg of crumbs(); track seg; let i = $index) {
  <span> › </span>
  <button type="button" (click)="goToLevel(i)">
    {{ pretty(seg) }}
  </button>
  }
</nav>

<div class="two">
  <!-- Left: categories -->
  @if (cats$ | async; as cats) {
  <aside class="left box">
    <ul>
      @for (c of cats; track c.path) {
      <li>
        <button class="chip" type="button" (click)="goInto(c)">
          {{ c.name }}
        </button>
      </li>
      }
    </ul>
  </aside>
  }

  <!-- Right: listings -->
  @if (listings$ | async; as res) {
  <section class="right box">
    <div class="listings-grid">
      @for (item of res.items; track item.id) {
      <app-listing-card [listing]="item" (selected)="navigateToListingDetail($event)" />
      }
    </div>

    <div class="pager">
      <button (click)="page = 0; reload()" [disabled]="page === 0">First</button>

      <button (click)="previous()" [disabled]="page === 0">Previous</button>

      <span>Page {{ page + 1 }} of {{ res.totalPages }}</span>

      <button (click)="next()" [disabled]="!res.hasNext">Next</button>

      <button (click)="page = res.totalPages - 1; reload()" [disabled]="res.totalPages <= 1">
        Last
      </button>
    </div>
  </section>
  }
</div>
